<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beco - صفحة الروابط</title>
    
    <!-- استدعاء خط كايرو -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- استدعاء مكتبة الأيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --accent-color: #D4AF37;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Cairo', sans-serif;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* نظام الأمواج في الخلفية */
        .waves-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 30vh;
            z-index: -1;
        }

        .wave {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* استخدام اللون الذهبي بشفافية 15% */
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="%23D4AF37" fill-opacity="0.15" d="M0,224L48,213.3C96,203,192,181,288,181.3C384,181,480,203,576,224C672,245,768,267,864,250.7C960,235,1056,181,1152,165.3C1248,149,1344,171,1392,181.3L1440,192L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path></svg>');
            background-size: 1440px 100%;
            background-repeat: repeat-x;
            animation: waveAnimate 20s linear infinite;
        }

        .wave2 {
            bottom: 5px;
            /* استخدام اللون الذهبي بشفافية 8% */
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="%23D4AF37" fill-opacity="0.08" d="M0,160L60,176C120,192,240,224,360,229.3C480,235,600,213,720,186.7C840,160,960,128,1080,122.7C1200,117,1320,139,1380,154.7L1440,171L1440,320L1380,320C1320,320,1200,320,1080,320C960,320,840,320,720,320C600,320,480,320,360,320C240,320,120,320,60,320L0,320Z"></path></svg>');
            animation: waveAnimate 15s linear infinite reverse;
        }

        @keyframes waveAnimate {
            0% { background-position-x: 0; }
            100% { background-position-x: 1440px; }
        }

        /* الحاوية الرئيسية */
        .container {
            background-color: var(--card-bg);
            width: 90%;
            max-width: 380px;
            padding: 40px 25px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            border: 1px solid #333;
            position: relative;
            z-index: 10;
        }

        /* تنسيق مكان الصورة */
        .profile-pic {
            width: 110px;
            height: 110px;
            background-color: #2a2a2a;
            border-radius: 50%;
            margin: 0 auto 20px;
            border: 2px solid var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.1);
        }

        h1 {
            margin: 0;
            font-size: 26px;
            color: var(--accent-color);
            font-weight: 700;
            letter-spacing: 1px;
        }

        p.bio {
            font-size: 15px;
            color: #b3b3b3;
            margin-bottom: 35px;
            margin-top: 5px;
        }

        /* تنسيق الأزرار */
        .links {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background-color: transparent;
            color: var(--text-main);
            text-decoration: none;
            padding: 14px 20px;
            border: 1px solid var(--accent-color);
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
        }

        .link-btn i {
            font-size: 20px;
            position: absolute;
            right: 20px;
        }

        /* تأثير التمرير */
        .link-btn:hover {
            background-color: var(--accent-color);
            color: var(--bg-color);
            transform: translateY(-4px);
            box-shadow: 0 6px 15px rgba(212, 175, 55, 0.2);
        }

        .link-btn:active {
            transform: translateY(1px);
        }

        @media (max-width: 350px) {
            .container { padding: 30px 15px; }
            h1 { font-size: 24px; }
            .link-btn { font-size: 14px; padding: 14px 15px; }
        }
    </style>
</head>
<body>

    <!-- حاوية الخلفية المتحركة -->
    <div class="waves-container">
        <div class="wave wave1"></div>
        <div class="wave wave2"></div>
    </div>

    <!-- الكارت الرئيسي -->
    <div class="container">
        <!-- الحاوية الخاصة بالصورة -->
        <div class="profile-pic">
            <i class="fa-solid fa-user-astronaut" style="font-size: 45px; color: var(--accent-color);"></i>
        </div>
        
        <h1>Beco</h1>
        <p class="bio"> تابعني على وسائل التواصل الاجتماعي </p>
        
        <!-- روابط التواصل الاجتماعي -->
        <div class="links">
            <a href="#" target="_blank" class="link-btn">
                <i class="fa-brands fa-facebook-f"></i>
                فيسبوك
            </a>
            <a href="#" target="_blank" class="link-btn">
                <i class="fa-brands fa-whatsapp"></i>
                واتساب
            </a>
            <a href="#" target="_blank" class="link-btn">
                <i class="fa-brands fa-telegram"></i>
                تلجرام
            </a>
            <a href="#" target="_blank" class="link-btn">
                <i class="fa-brands fa-tiktok"></i>
                تيك توك
            </a>
        </div>
    </div>

</body>
</html>
